<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>利用規約・プライバシーポリシー | Fant</title>
  <style>
    :root {
      --fant-yellow: #F3ED63;
      --ink: #171717;
      --muted: #666;
      --paper: #fff;
      --line: #e4e4e4;
      --header-h: 58px;
      --tabs-h: 58px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--fant-yellow);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
        "Yu Gothic", "Noto Sans JP", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button {
      font: inherit;
    }

    .sticky-shell {
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .site-header {
      min-height: var(--header-h);
      background: #000;
      color: #fff;
    }

    .site-header__inner {
      max-width: 980px;
      min-height: var(--header-h);
      margin: 0 auto;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .fant-logo {
      width: 58px;
      height: auto;
      flex: 0 0 auto;
      display: block;
    }

    .header-copy {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 12px;
      line-height: 1.3;
    }

    .service-name {
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
    }

    .legal-title {
      font-size: 14px;
      font-weight: 700;
      color: #f0f0f0;
      white-space: nowrap;
    }

    .tabs-wrap {
      min-height: var(--tabs-h);
      background: var(--fant-yellow);
      border-bottom: 1px solid rgba(0, 0, 0, .18);
      box-shadow: 0 2px 7px rgba(0, 0, 0, .08);
    }

    .tabs {
      max-width: 980px;
      margin: 0 auto;
      padding: 8px 14px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      flex: 0 0 auto;
      min-height: 40px;
      padding: 8px 16px;
      appearance: none;
      border: 1px solid rgba(0, 0, 0, .28);
      border-radius: 999px;
      background: rgba(255, 255, 255, .55);
      color: #222;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab[aria-selected="true"] {
      background: #000;
      color: #fff;
      border-color: #000;
    }

    .page {
      max-width: 820px;
      margin: 0 auto;
      padding: 28px 14px calc(44px + env(safe-area-inset-bottom));
    }

    .document {
      background: var(--paper);
      border-radius: 10px;
      padding: 28px 26px 40px;
      min-height: 65vh;
      box-shadow: 0 3px 10px rgba(0, 0, 0, .07);
    }

    .doc-heading {
      margin: 0 0 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .doc-heading__label {
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .doc-heading h1 {
      margin: 0;
      font-size: 23px;
      line-height: 1.45;
    }

    .markdown-body {
      font-size: 15px;
      line-height: 1.95;
      overflow-wrap: anywhere;
    }

    .markdown-body> :first-child {
      margin-top: 0;
    }

    .markdown-body h1 {
      display: none;
    }

    .markdown-body h2 {
      margin: 34px 0 12px;
      font-size: 18px;
      line-height: 1.6;
    }

    .markdown-body h3 {
      margin: 28px 0 10px;
      font-size: 16px;
      line-height: 1.6;
    }

    .markdown-body p {
      margin: 0 0 14px;
    }

    .markdown-body ol,
    .markdown-body ul {
      margin: 8px 0 18px;
      padding-left: 1.7em;
    }

    .markdown-body li {
      margin: 5px 0;
      padding-left: .15em;
    }

    .markdown-body a {
      color: #222;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .markdown-body blockquote {
      margin: 18px 0;
      padding: 12px 15px;
      background: #fafafa;
      border-left: 3px solid var(--fant-yellow);
      color: #444;
    }

    .markdown-body hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 28px 0;
    }

    .loading {
      padding: 42px 10px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .error-box {
      padding: 18px;
      border: 1px solid #e0b4b4;
      border-radius: 8px;
      background: #fff7f7;
      color: #7c2525;
      line-height: 1.7;
    }

    .error-box strong {
      display: block;
      margin-bottom: 4px;
    }

    .footer {
      padding: 0 14px 28px;
      text-align: center;
      color: rgba(0, 0, 0, .62);
      font-size: 12px;
    }

    @media (max-width: 600px) {
      :root {
        --header-h: 64px;
        --tabs-h: 56px;
      }

      .site-header__inner {
        padding: 8px 12px;
        gap: 10px;
      }

      .fant-logo {
        width: 52px;
      }

      .header-copy {
        display: block;
      }

      .service-name,
      .legal-title {
        display: block;
        font-size: 12px;
        line-height: 1.45;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .legal-title {
        color: #d8d8d8;
      }

      .tabs {
        padding: 8px 10px;
      }

      .tab {
        min-height: 38px;
        padding: 8px 14px;
        font-size: 13px;
      }

      .page {
        padding: 16px 10px calc(32px + env(safe-area-inset-bottom));
      }

      .document {
        border-radius: 8px;
        padding: 22px 18px 32px;
      }

      .doc-heading h1 {
        font-size: 20px;
      }

      .markdown-body {
        font-size: 14px;
        line-height: 1.9;
      }

      .markdown-body h2 {
        margin-top: 30px;
        font-size: 17px;
      }
    }
  </style>
</head>

<body>
  <div class="sticky-shell">
    <header class="site-header">
      <div class="site-header__inner">
        <a href="https://fant.jp/" target="_blank" rel="noopener noreferrer" aria-label="Fant公式サイト">
          <img class="fant-logo" src="assets/fant-logo.png" alt="Fant">
        </a>
        <div class="header-copy">
          <span class="service-name">鳥獣駆除依頼システム</span>
          <span class="legal-title">利用規約・プライバシーポリシー</span>
        </div>
      </div>
    </header>

    <div class="tabs-wrap">
      <nav id="tabs" class="tabs" aria-label="文書一覧"></nav>
    </div>
  </div>

  <main class="page">
    <article class="document" aria-live="polite">
      <div id="docHeading" class="doc-heading" hidden>
        <div id="docAreaLabel" class="doc-heading__label"></div>
        <h1 id="docTitle"></h1>
      </div>
      <div id="content" class="markdown-body">
        <div class="loading">文書を読み込んでいます。</div>
      </div>
    </article>
  </main>

  <footer class="footer">運営：株式会社Fant</footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script>
    (() => {
      const params = new URLSearchParams(location.search)
      const area = (params.get("area") || "").trim().toLowerCase()
      const requestedDoc = (params.get("doc") || "").trim()
      const AREA_PATTERN = /^[a-z0-9_-]+$/

      const tabsEl = document.getElementById("tabs")
      const contentEl = document.getElementById("content")
      const docHeadingEl = document.getElementById("docHeading")
      const docAreaLabelEl = document.getElementById("docAreaLabel")
      const docTitleEl = document.getElementById("docTitle")

      let config = null
      let currentDocKey = null

      function showError(title, detail) {
        docHeadingEl.hidden = true
        contentEl.innerHTML =
          `<div class="error-box"><strong>${escapeHtml(title)}</strong>${escapeHtml(detail || "")}</div>`
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;")
      }

      function buildDocUrl(file) {
        if (!file || file.includes("..") || file.startsWith("/") || /:\/\//.test(file)) {
          throw new Error("Invalid document path")
        }
        return `doc/${encodeURIComponent(area)}/${file}`
      }

      async function fetchText(url) {
        const response = await fetch(url, {cache: "no-cache"})
        if (!response.ok) throw new Error(`HTTP ${response.status}`)
        return response.text()
      }

      async function loadDocument(docKey, updateHistory = true) {
        if (!config) return

        const doc = config.documents.find(item => item.key === docKey) || config.documents[0]
        if (!doc) {
          showError("表示できる文書がありません。", "管理者へお問い合わせください。")
          return
        }

        currentDocKey = doc.key

        tabsEl.querySelectorAll(".tab").forEach(button => {
          button.setAttribute(
            "aria-selected",
            button.dataset.key === currentDocKey ? "true" : "false"
          )
        })

        docHeadingEl.hidden = false
        docAreaLabelEl.textContent = config.areaName || area
        docTitleEl.textContent = doc.label
        contentEl.innerHTML = '<div class="loading">文書を読み込んでいます。</div>'

        try {
          const markdown = await fetchText(buildDocUrl(doc.file))

          if (window.marked) {
            marked.setOptions({gfm: true, breaks: true})
            contentEl.innerHTML = marked.parse(markdown)
          } else {
            contentEl.innerHTML =
              `<pre style="white-space:pre-wrap;font:inherit;line-height:1.9">${escapeHtml(markdown)}</pre>`
          }

          if (updateHistory) {
            const next = new URL(location.href)
            next.searchParams.set("area", area)
            next.searchParams.set("doc", doc.key)
            history.replaceState({}, "", next)
          }

          document.title = `${doc.label} | ${config.areaName || "Fant"}`
          window.scrollTo({top: 0, behavior: "smooth"})
        } catch (err) {
          console.error(err)
          showError("文書を読み込めませんでした。", "しばらくしてからもう一度お試しください。")
        }
      }

      function renderTabs() {
        tabsEl.innerHTML = ""

        config.documents.forEach(doc => {
          const button = document.createElement("button")
          button.type = "button"
          button.className = "tab"
          button.dataset.key = doc.key
          button.setAttribute("aria-selected", "false")
          button.textContent = doc.label
          button.addEventListener("click", () => loadDocument(doc.key))
          tabsEl.appendChild(button)
        })
      }

      async function init() {
        if (!AREA_PATTERN.test(area)) {
          showError("自治体が指定されていません。", "正しいリンクから開いてください。")
          return
        }

        try {
          const configText = await fetchText(`doc/${encodeURIComponent(area)}/config.json`)
          config = JSON.parse(configText)

          if (!Array.isArray(config.documents) || config.documents.length === 0) {
            throw new Error("documents is empty")
          }

          renderTabs()

          const initial = config.documents.some(doc => doc.key === requestedDoc)
            ? requestedDoc
            : (config.defaultDocument || config.documents[0].key)

          await loadDocument(initial, false)
        } catch (err) {
          console.error(err)
          showError("設定を読み込めませんでした。", "正しいリンクから開いてください。")
        }
      }

      init()
    })()
  </script>
</body>

</html>
