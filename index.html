<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>駆除依頼場所の選択</title>

    <div id="appDialogBackdrop" class="app-dialog-backdrop" role="dialog" aria-modal="true"
        aria-labelledby="appDialogMessage">
        <div class="app-dialog">
            <div id="appDialogMessage" class="app-dialog-message"></div>
            <div class="app-dialog-actions">
                <button id="appDialogOk" type="button" class="app-dialog-ok">OK</button>
            </div>
        </div>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        :root {
            --line: #06c755;
            --blue: #2196f3;
            --red: #e53935;
            --gray: #666;
            --light: #f5f7fa;
            --border: #d9dee7;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--light);
            color: #222;
        }

        body {
            padding: 10px;
            padding-bottom: calc(82px + env(safe-area-inset-bottom));
        }

        .card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 12px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .04);
        }

        .section-title {
            display: block;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .description {
            margin: 0 0 12px;
            color: var(--gray);
            line-height: 1.6;
            font-size: .94rem;
        }

        .muted {
            color: var(--gray);
            font-size: .9rem;
        }

        .notice {
            margin-top: 8px;
            padding: 10px;
            border-radius: 10px;
            background: #f7f9fc;
            border: 1px solid var(--border);
            line-height: 1.5;
            font-size: .9rem;
        }

        .notice.error {
            background: #fff5f5;
            border-color: #f0b4b4;
            color: #b71c1c;
        }

        .notice.success {
            background: #f2fbf5;
            border-color: #a9dfb7;
            color: #176b31;
        }

        label {
            display: block;
            font-weight: 800;
            margin: 12px 0 6px;
        }

        select,
        button,
        input[type="file"] {
            width: 100%;
            font: inherit;
            border-radius: 10px;
        }

        select {
            border: 1px solid var(--border);
            padding: 12px;
            background: #fff;
        }

        button {
            cursor: pointer;
        }

        #mapWrap {
            position: relative;
            width: 100%;
        }

        #map {
            width: 100%;
            height: 65vh;
            min-height: 320px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: #ddd;
        }

        .place-box {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            margin-top: 10px;
            background: #fafafa;
            line-height: 1.55;
            word-break: break-word;
            font-size: .92rem;
        }

        .place-title {
            font-weight: 800;
            margin-bottom: 4px;
        }

        #confirmBtn {
            margin-top: 10px;
            padding: 13px 12px;
            border: none;
            background: var(--blue);
            color: #fff;
            font-size: 1rem;
            font-weight: 800;
        }

        #photoInput {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .photo-picker {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }

        .photo-picker-button {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #fff;
            font-weight: 800;
            cursor: pointer;
            user-select: none;
        }

        .photo-picker-button:active {
            transform: translateY(1px);
        }

        #photoMeta {
            flex: 1 1 auto;
            margin-top: 0;
            min-width: 0;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            margin-top: 10px;
        }

        .photo-item {
            position: relative;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            background: #f2f2f2;
            aspect-ratio: 1 / 1;
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .photo-remove {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, .72);
            color: #fff;
            font-weight: 800;
            line-height: 30px;
            padding: 0;
        }

        .photo-meta {
            margin-top: 8px;
            font-size: .88rem;
            color: var(--gray);
            line-height: 1.5;
        }

        .footer {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
            background: rgba(255, 255, 255, .96);
            border-top: 1px solid var(--border);
            backdrop-filter: blur(8px);
            z-index: 20;
        }

        #sendBtn {
            border: none;
            background: var(--line);
            color: #fff;
            padding: 15px 12px;
            font-size: 1.08rem;
            font-weight: 800;
        }

        #sendBtn:disabled,
        #confirmBtn:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #sendStatus {
            margin-top: 8px;
            text-align: center;
            font-size: .9rem;
        }

        @media (max-width: 420px) {
            body {
                padding: 10px;
                padding-bottom: calc(112px + env(safe-area-inset-bottom));
            }

            #map {
                height: 54vh;
                min-height: 300px;
            }

            .photo-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        /* 独自メッセージダイアログ */
        .app-dialog-backdrop {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(0, 0, 0, .42);
        }

        .app-dialog-backdrop.show {
            display: flex;
        }

        .app-dialog {
            width: min(100%, 360px);
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, .24);
            overflow: hidden;
        }

        .app-dialog-message {
            padding: 24px 20px 20px;
            font-size: 16px;
            line-height: 1.7;
            color: #222;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .app-dialog-actions {
            border-top: 1px solid #e5e5e5;
            padding: 12px 16px;
            text-align: center;
        }

        .app-dialog-ok {
            min-width: 120px;
            border: 0;
            border-radius: 8px;
            padding: 10px 24px;
            background: #06c755;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <strong class="section-title">駆除依頼内容</strong>
    <section class="card">
        <label for="targetAnimal">駆除対象動物</label>
        <select id="targetAnimal">
            <option value="">選択してください</option>
            <option value="シカ">シカ</option>
            <option value="イノシシ">イノシシ</option>
            <option value="アライグマ">アライグマ</option>
            <option value="カラスなど鳥類">カラスなど鳥類</option>
            <option value="その他の動物">その他の動物（別途、対象動物の確認をします）</option>
        </select>

        <label for="controlMethod">駆除方法</label>
        <select id="controlMethod">
            <option value="">選択してください</option>
            <option value="指定無し">指定無し</option>
            <option value="罠猟">罠猟</option>
            <option value="猟銃">猟銃</option>
            <option value="網猟">網猟</option>
        </select>

        <label for="hunterSupport">協力可能事項</label>
        <select id="hunterSupport">
            <option value="">選択してください</option>
            <option value="特になし">特になし</option>
            <option value="餌の追加">餌の追加</option>
            <option value="罠の確認">罠の確認</option>
        </select>
    </section>

    <section class="card">
        <strong class="section-title">駆除依頼場所写真（任意）</strong>
        <p class="description">駆除依頼場所の写真を最大5枚まで登録できます。<br>1枚あたり10MBまで選択できます。</p>
        <div class="photo-picker">
            <label for="photoInput" class="photo-picker-button">写真を選択</label>
            <div id="photoMeta" class="photo-meta">写真 0 / 5枚</div>
        </div>
        <input id="photoInput" type="file" accept="image/*" multiple>
        <div id="photoGrid" class="photo-grid"></div>
    </section>

    <section class="card">
        <strong class="section-title">駆除依頼場所の選択</strong>
        <p id="info" class="description">地図上の駆除依頼地点をタップして、場所を確定してください。</p>
        <div id="mapWrap">
            <div id="map"></div>
        </div>
        <button id="confirmBtn" type="button" disabled>この場所で確定</button>
        <div id="placeBox" class="place-box">
            <div class="place-title">選択場所</div>
            <div class="muted">住所：未選択</div>
            <div class="muted">座標：未選択</div>
        </div>
    </section>

    <div class="footer">
        <button id="sendBtn" type="button" disabled>駆除依頼の送信</button>
        <div id="sendStatus"></div>
    </div>

    <script>
        const LIFF_ID = "2009188516-g4iIlaf8"
        const GOOGLE_API_KEY = "AIzaSyBoyT10gc7UNf9j9SKKp_GRDdS7QNfMYrk"
        const DEFAULT_CENTER = {lat: 34.52815856202822, lng: 135.95238437983932}

        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwq2AHcWVtLxK2aNIw_tBeaxEuM_-D_7gdRvgdUUkRW75ng-kglyN_jkPFEFo71b-43ng/exec"

        const DRIVE_ROOT_FOLDER_NAME = "宇陀市駆除依頼"
        const MAX_PHOTOS = 5
        const MAX_SOURCE_BYTES = 10 * 1024 * 1024
        const MAX_LONG_EDGE = 1600
        const JPEG_QUALITY = 0.82

        let map
        let previewMarker
        let confirmedMarker
        let geocoder
        let previewLatLng = null
        let previewAddress = ""
        let confirmedLatLng = null
        let confirmedAddress = ""
        let mapRequestId = 0
        let isConfirmed = false
        let isSending = false
        let lineProfile = null
        let selectedPhotos = []

        const el = (id) => document.getElementById(id)

        function validateForm() {
            return Boolean(
                el("targetAnimal").value &&
                el("controlMethod").value &&
                el("hunterSupport").value &&
                confirmedLatLng &&
                isConfirmed &&
                !isSending
            )
        }

        function updateSendButtonState() {
            el("sendBtn").disabled = !validateForm()
        }

        async function initLiff() {
            try {
                await liff.init({liffId: LIFF_ID})
                if (!liff.isLoggedIn()) {
                    //                    liff.login()
                    return
                }
                lineProfile = await liff.getProfile()
            } catch (e) {
                console.error("LIFF initialization/profile error", e)
            }
        }

        window.initMap = function initMap() {
            geocoder = new google.maps.Geocoder()
            map = new google.maps.Map(el("map"), {
                center: DEFAULT_CENTER,
                zoom: 16,
                gestureHandling: "greedy",
                mapTypeControl: false,
                streetViewControl: false,
                fullscreenControl: false
            })
            map.addListener("click", (event) => selectLocation(event.latLng))
            el("info").innerText = "地図上の駆除依頼地点をタップしてください。"
        }

        function selectLocation(latLng) {
            mapRequestId += 1
            const currentId = mapRequestId
            previewLatLng = latLng
            previewAddress = ""
            isConfirmed = false
            confirmedLatLng = null
            confirmedAddress = ""

            if (!previewMarker) {
                previewMarker = new google.maps.Marker({
                    position: previewLatLng,
                    map: map,
                    icon: {
                        path: "M 0,-42 C -11,-42 -20,-33 -20,-22 C -20,-7 0,8 0,8 C 0,8 20,-7 20,-22 C 20,-33 11,-42 0,-42 Z M 0,-30 A 8,8 0 1,0 0,-14 A 8,8 0 1,0 0,-30",
                        fillColor: "#e53935",
                        fillOpacity: 1,
                        strokeColor: "#ffffff",
                        strokeWeight: 3,
                        scale: 1,
                        anchor: new google.maps.Point(0, 0)
                    }
                })
            } else {
                previewMarker.setPosition(previewLatLng)
                previewMarker.setMap(map)
            }

            el("info").innerText = "住所取得中です。"
            el("confirmBtn").innerText = "この場所で確定"
            el("confirmBtn").disabled = false
            updateSendButtonState()
            renderPlaceBox("住所取得中...", previewLatLng.lat(), previewLatLng.lng())

            geocoder.geocode({location: previewLatLng}, (results, status) => {
                if (currentId !== mapRequestId) return
                if (status === "OK" && results[0]) {
                    previewAddress = results[0].formatted_address
                } else {
                    const lat = previewLatLng.lat()
                    const lng = previewLatLng.lng()
                    previewAddress = `緯度:${lat}, 経度:${lng}`
                }
                renderPlaceBox(previewAddress, previewLatLng.lat(), previewLatLng.lng())
                el("info").innerText = "赤いピンの場所を確認して確定してください。"
            })
        }

        function renderPlaceBox(address, lat, lng) {
            el("placeBox").innerHTML = `
                <div class="place-title">選択場所</div>
                <div>住所：${escapeHtml(address)}</div>
                <div>座標：${Number(lat).toFixed(8)}, ${Number(lng).toFixed(8)}</div>
            `
        }

        el("confirmBtn").addEventListener("click", () => {
            if (!previewLatLng) return
            confirmedLatLng = previewLatLng
            confirmedAddress = previewAddress
            isConfirmed = true

            if (!confirmedMarker) {
                confirmedMarker = new google.maps.Marker({
                    position: confirmedLatLng,
                    map: map,
                    icon: {
                        path: google.maps.SymbolPath.CIRCLE,
                        scale: 10,
                        fillColor: "#e53935",
                        fillOpacity: 1,
                        strokeColor: "#ffffff",
                        strokeWeight: 3
                    }
                })
            } else {
                confirmedMarker.setPosition(confirmedLatLng)
                confirmedMarker.setMap(map)
            }

            el("confirmBtn").innerText = "依頼場所の変更"
            el("info").innerText = "この場所で送信できます。変更する場合は、ピンを移動してから再度確定してください。"
            renderPlaceBox(confirmedAddress, confirmedLatLng.lat(), confirmedLatLng.lng())
            updateSendButtonState()
        })

        el("photoInput").addEventListener("change", async (event) => {
            const incoming = Array.from(event.target.files || [])
            event.target.value = ""
            if (!incoming.length) return

            if (selectedPhotos.length + incoming.length > MAX_PHOTOS) {
                showPhotoNotice(`登録できる写真は最大${MAX_PHOTOS}枚までです。`, true)
                return
            }

            for (const file of incoming) {
                if (file.size > MAX_SOURCE_BYTES) {
                    showPhotoNotice(`${file.name} は10MBを超えているため追加できません。`, true)
                    continue
                }
                if (!file.type.startsWith("image/")) {
                    showPhotoNotice(`${file.name} は画像ファイルではありません。`, true)
                    continue
                }
                try {
                    const processed = await resizeImageToJpeg(file)
                    selectedPhotos.push(processed)
                } catch (e) {
                    console.error(e)
                    showPhotoNotice(`${file.name} を読み込めませんでした。別の画像を選択してください。`, true)
                }
            }
            renderPhotoGrid()
        })

        function renderPhotoGrid() {
            const grid = el("photoGrid")
            grid.innerHTML = ""
            selectedPhotos.forEach((photo, index) => {
                const item = document.createElement("div")
                item.className = "photo-item"
                item.innerHTML = `
                    <img src="${photo.previewUrl}" alt="写真${index + 1}">
                    <button class="photo-remove" type="button" aria-label="写真${index + 1}を削除">×</button>
                `
                item.querySelector("button").addEventListener("click", () => {
                    URL.revokeObjectURL(selectedPhotos[index].previewUrl)
                    selectedPhotos.splice(index, 1)
                    renderPhotoGrid()
                })
                grid.appendChild(item)
            })
            const totalBytes = selectedPhotos.reduce((sum, photo) => sum + photo.blob.size, 0)
            el("photoMeta").innerText = selectedPhotos.length
                ? `写真 ${selectedPhotos.length} / ${MAX_PHOTOS}枚（送信サイズ 約${formatBytes(totalBytes)}）`
                : `写真 0 / ${MAX_PHOTOS}枚`
        }

        async function resizeImageToJpeg(file) {
            const image = await loadImage(file)
            const srcWidth = image.naturalWidth || image.width
            const srcHeight = image.naturalHeight || image.height
            const scale = Math.min(1, MAX_LONG_EDGE / Math.max(srcWidth, srcHeight))
            const width = Math.max(1, Math.round(srcWidth * scale))
            const height = Math.max(1, Math.round(srcHeight * scale))

            const canvas = document.createElement("canvas")
            canvas.width = width
            canvas.height = height
            const ctx = canvas.getContext("2d", {alpha: false})
            ctx.fillStyle = "#ffffff"
            ctx.fillRect(0, 0, width, height)
            ctx.drawImage(image, 0, 0, width, height)

            const blob = await new Promise((resolve, reject) => {
                canvas.toBlob((result) => result ? resolve(result) : reject(new Error("JPEG conversion failed")), "image/jpeg", JPEG_QUALITY)
            })
            if (image._objectUrl) URL.revokeObjectURL(image._objectUrl)
            return {blob, previewUrl: URL.createObjectURL(blob), originalName: file.name}
        }

        function loadImage(file) {
            return new Promise((resolve, reject) => {
                const objectUrl = URL.createObjectURL(file)
                const image = new Image()
                image.onload = () => {
                    image._objectUrl = objectUrl
                    resolve(image)
                }
                image.onerror = () => {
                    URL.revokeObjectURL(objectUrl)
                    reject(new Error("Image load failed"))
                }
                image.src = objectUrl
            })
        }


        function showAppDialog(message) {
            const backdrop = document.getElementById("appDialogBackdrop")
            const messageEl = document.getElementById("appDialogMessage")
            const okButton = document.getElementById("appDialogOk")

            messageEl.innerText = String(message || "")
            backdrop.classList.add("show")

            return new Promise(resolve => {
                const close = () => {
                    backdrop.classList.remove("show")
                    okButton.removeEventListener("click", close)
                    resolve()
                }
                okButton.addEventListener("click", close)
                setTimeout(() => okButton.focus(), 0)
            })
        }

        function showPhotoNotice(text, isError) {
            if (isError) showAppDialog(text)
        }

        function createRequestNo() {
            const now = new Date()
            const y = now.getFullYear()
            const m = String(now.getMonth() + 1).padStart(2, "0")
            const d = String(now.getDate()).padStart(2, "0")
            const hh = String(now.getHours()).padStart(2, "0")
            const mm = String(now.getMinutes()).padStart(2, "0")
            const ss = String(now.getSeconds()).padStart(2, "0")
            const suffix = Math.random().toString(36).slice(2, 6).toUpperCase().padEnd(4, "0")
            return `REQ_${y}${m}${d}_${hh}${mm}${ss}_${suffix}`
        }

        function sanitizeFolderPart(value) {
            return String(value || "")
                .replace(/[\\/:*?"<>|#%{}~&]/g, "_")
                .replace(/[\r\n\t]/g, " ")
                .replace(/\s+/g, " ")
                .trim()
                .slice(0, 80) || "unknown"
        }

        async function buildUploadPayload(requestNo) {
            if (!lineProfile && typeof liff !== "undefined" && liff.isLoggedIn()) {
                lineProfile = await liff.getProfile()
            }
            if (!lineProfile || !lineProfile.userId) {
                throw new Error("LINEユーザー情報を取得できませんでした。LINEから開き直してください。")
            }

            const idToken = (typeof liff !== "undefined" && liff.getIDToken) ? liff.getIDToken() : null
            if (!idToken) {
                throw new Error("LINE認証情報を取得できませんでした。LINEから開き直してください。")
            }

            const photos = []
            for (let i = 0; i < selectedPhotos.length; i += 1) {
                const fileName = `${requestNo}_${String(i + 1).padStart(2, "0")}.jpg`
                photos.push({
                    fileName,
                    mimeType: "image/jpeg",
                    base64: await blobToBase64(selectedPhotos[i].blob)
                })
            }

            return {
                action: "saveRequestPhotos",
                rootFolderName: DRIVE_ROOT_FOLDER_NAME,
                requestFolderName: requestNo,
                requestNo,
                // GAS側でLINE PlatformにIDトークンを照合し、sub(userId) と name(displayName) から「LINEID_表示名」フォルダ名を生成。
                idToken,
                createdAt: new Date().toISOString(),
                photos
            }
        }

        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader()
                reader.onload = () => resolve(String(reader.result).split(",")[1])
                reader.onerror = reject
                reader.readAsDataURL(blob)
            })
        }

        async function uploadPhotosToDrive(payload) {
            if (!selectedPhotos.length) return {skipped: true}
            if (!GAS_WEB_APP_URL) {
                // ER-001: クライアント側にGAS WebアプリURLが設定されていない。
                throw new Error("アップロードに失敗しました（エラーコード：ER-001）")
            }

            let response
            try {
                response = await fetch(GAS_WEB_APP_URL, {
                    method: "POST",
                    headers: {"Content-Type": "text/plain;charset=utf-8"},
                    body: JSON.stringify(payload),
                    redirect: "follow"
                })
            } catch (e) {
                // ER-004: ネットワーク断・CORS・GAS到達不能などfetch自体が失敗した。
                console.error("ER-004 upload fetch error", e)
                throw new Error("アップロードに失敗しました（エラーコード：ER-004）")
            }

            if (!response.ok) {
                // ER-002: GAS WebアプリへのHTTP通信が正常終了しなかった。
                console.error("ER-002 upload HTTP error", response.status)
                throw new Error("アップロードに失敗しました（エラーコード：ER-002）")
            }

            const text = await response.text()
            let result
            try {
                result = JSON.parse(text)
            } catch {
                // ER-003: GASからJSONとして解釈できる応答が返らなかった。
                throw new Error("アップロードに失敗しました（エラーコード：ER-003）")
            }
            if (!result.ok) {
                // GAS側が返したER-1xx系コードを表示。未分類の場合はER-199。
                const serverCode = result.errorCode || "ER-199"
                console.error("Server upload error", serverCode, result.message || "")
                throw new Error(`アップロードに失敗しました（エラーコード：${serverCode}）`)
            }
            return result
        }

        el("sendBtn").addEventListener("click", async () => {
            if (!confirmedLatLng || !isConfirmed || !validateForm()) return
            isSending = true
            updateSendButtonState()
            el("sendStatus").innerText = "送信処理中..."

            try {
                const requestNo = createRequestNo()
                const animal = el("targetAnimal").value
                const method = el("controlMethod").value
                const hunterSupport = el("hunterSupport").value
                const lat = confirmedLatLng.lat()
                const lng = confirmedLatLng.lng()

                if (selectedPhotos.length) {
                    el("sendStatus").innerText = "写真をアップロード中..."
                    const payload = await buildUploadPayload(requestNo)
                    await uploadPhotosToDrive(payload)
                }

                const photoText = selectedPhotos.length ? `${selectedPhotos.length}枚` : "なし"
                const message = `受付ID：${requestNo}\n駆除対象：${animal}\n駆除方法：${method}\nハンターへの協力可能事項：${hunterSupport}\n住所：${confirmedAddress}\n座標：${lat}, ${lng}\n写真：${photoText}`

                el("sendStatus").innerText = "LINEへ依頼内容を送信中..."
                if (typeof liff !== "undefined" && liff.isInClient()) {
                    await liff.sendMessages([
                        {type: "text", text: "駆除依頼登録をお願いします"},
                        {type: "text", text: message}
                    ])
                    liff.closeWindow()
                } else {
                    showAppDialog(message)
                    el("sendStatus").innerText = "ブラウザ確認モード：LINE送信は行っていません。"
                }
            } catch (e) {
                console.error(e)
                showAppDialog(e.message || "送信処理に失敗しました。")
                el("sendStatus").innerText = "送信できませんでした。内容を確認して再度お試しください。"
            } finally {
                isSending = false
                updateSendButtonState()
            }
        })

        function loadGoogleMaps() {
            const script = document.createElement("script")
            script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_API_KEY}&loading=async&callback=initMap`
            script.async = true
            script.defer = true
            document.head.appendChild(script)
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;")
        }

        function formatBytes(bytes) {
            if (bytes < 1024) return `${bytes} B`
            if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} KB`
            return `${(bytes / (1024 * 1024)).toFixed(1)} MB`
        }

        el("targetAnimal").addEventListener("change", updateSendButtonState)
        el("controlMethod").addEventListener("change", updateSendButtonState)
        el("hunterSupport").addEventListener("change", updateSendButtonState)

        updateSendButtonState()
        initLiff()
        loadGoogleMaps()
    </script>
</body>

</html>
