<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>依頼番号送信</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --line: #06c755;
      --gray: #666;
      --light: #f5f7fa;
      --border: #d9dee7;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--light);
      color: #222;
      overflow-x: hidden;
    }

    body {
      padding: 10px;
      padding-bottom: calc(152px + env(safe-area-inset-bottom));
    }

    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      padding-bottom: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .04);
    }

    .section-title {
      display: block;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .description {
      margin: 0;
      color: var(--gray);
      line-height: 1.6;
      font-size: .94rem;
    }

    .map-frame {
      width: 100%;
      height: calc(100vh - 270px);
      min-height: 360px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #ddd;
    }

    .map-frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, .96);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(8px);
      z-index: 20;
    }

    .input-label {
      display: block;
      font-weight: 800;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      font: inherit;
      font-size: 1.1rem;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      background: var(--line);
      color: #fff;
      padding: 15px 12px;
      font: inherit;
      font-size: 1.08rem;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    @media (max-width:420px) {
      body {
        padding: 10px;
        padding-bottom: calc(140px + env(safe-area-inset-bottom));
      }

      .map-frame {
        height: calc(100vh - 270px);
        min-height: 320px;
      }
    }
  </style>

</head>

<body>

  <section class="card">
    <strong class="section-title">依頼番号の送信</strong>
    <p class="description">マップで依頼番号を確認し、下の入力欄に数字のみの番号を入力して送信してください。</p>

    <div class="map-frame" style="margin-top:12px;">
      <iframe
        src="https://www.google.com/maps/d/u/1/viewer?mid=1QW6PGPrfLC-OXtSlf9AyU2Dha4E3grI&ll=42.923935100000094%2C143.1960362&z=12"></iframe>
    </div>
  </section>

  <div class="footer" id="footerBox">
    <label class="input-label" for="reqNo">依頼番号</label>
    <input id="reqNo" inputmode="numeric" autocomplete="off" placeholder="例: 123">
    <button id="sendBtn" type="button">送信</button>
  </div>

  <script>
    const LIFF_ID = "2010524840-2oS0W5Kh"

    const el = (id) => document.getElementById(id)

    async function init() {
      try {
        await liff.init({ liffId: LIFF_ID })
      } catch (e) {
        console.log("LIFF outside")
      }
    }

    function normalizeNumber(str) {
      return str.replace(/[０-９]/g, s =>
        String.fromCharCode(s.charCodeAt(0) - 65248)
      )
    }

    async function send() {
      let input = el("reqNo").value.trim()

      if (!input) {
        alert("依頼番号を入力してください")
        return
      }

      input = normalizeNumber(input)

      const match = input.match(/(\d+)/)

      if (!match) {
        alert("数字のみ入力してください")
        return
      }

      const no = match[1]

      if (typeof liff === "undefined" || !liff.isInClient()) {
        alert("LINE内から開いてください")
        return
      }

      try {
        await liff.sendMessages([
          {
            type: "text",
            text: `依頼No.${no}`
          }
        ])

        liff.closeWindow()
      } catch (e) {
        alert("送信失敗")
      }
    }

    function adjustFooter() {
      if (!window.visualViewport) return

      const vv = window.visualViewport
      const footer = el("footerBox")

      function update() {
        const keyboardHeight = Math.max(0, window.innerHeight - vv.height - vv.offsetTop)
        footer.style.transform = keyboardHeight > 0 ? `translateY(-${keyboardHeight}px)` : "translateY(0)"
      }

      vv.addEventListener("resize", update)
      vv.addEventListener("scroll", update)
      update()
    }

    el("sendBtn").addEventListener("click", send)

    el("reqNo").addEventListener("focus", () => {
      setTimeout(() => {
        window.scrollTo({ top: 0, behavior: "smooth" })
      }, 150)
    })

    init()
    adjustFooter()
  </script>

</body>

</html>
