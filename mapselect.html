<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>駆除依頼場所の選択</title>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        :root {
            --line: #06c755;
            --blue: #2196f3;
            --red: #e53935;
            --gray: #666;
            --light: #f5f7fa;
            --border: #d9dee7;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--light);
            color: #222;
        }

        body {
            padding: 10px;
            padding-bottom: calc(72px + env(safe-area-inset-bottom));
        }

        h1 {
            margin: 0 0 12px;
            font-size: 1.25rem;
            line-height: 1.4;
        }

        .card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 12px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .04);
        }

        .section-title {
            display: block;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .description {
            margin: 0 0 12px;
            color: var(--gray);
            line-height: 1.6;
            font-size: .94rem;
        }

        #mapWrap {
            position: relative;
            width: 100%;
        }

        #map {
            width: 100%;
            height: 65vh;
            min-height: 320px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: #ddd;
        }

        #centerPin {
            display: none;
        }

        .place-box {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            margin-top: 10px;
            background: #fafafa;
            line-height: 1.55;
            word-break: break-word;
            font-size: .92rem;
        }

        .place-title {
            font-weight: 800;
            margin-bottom: 4px;
        }

        .muted {
            color: var(--gray);
        }

        label {
            display: block;
            font-weight: 800;
            margin: 12px 0 6px;
        }

        select,
        button {
            width: 100%;
            font: inherit;
            border-radius: 10px;
        }

        select {
            border: 1px solid var(--border);
            padding: 12px;
            background: #fff;
        }

        button {
            cursor: pointer;
        }

        #confirmBtn {
            margin-top: 10px;
            padding: 13px 12px;
            border: none;
            background: var(--blue);
            color: #fff;
            font-size: 1rem;
            font-weight: 800;
        }

        #confirmBtn:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .footer {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
            background: rgba(255, 255, 255, .96);
            border-top: 1px solid var(--border);
            backdrop-filter: blur(8px);
            z-index: 20;
        }

        #sendBtn {
            border: none;
            background: var(--line);
            color: #fff;
            padding: 15px 12px;
            font-size: 1.08rem;
            font-weight: 800;
        }

        #sendBtn:disabled {
            background: #999;
            cursor: not-allowed;
        }

        @media (max-width: 420px) {
            body {
                padding: 10px;
                padding-bottom: calc(102px + env(safe-area-inset-bottom));
            }

            #map {
                height: 54vh;
                min-height: 300px;
            }
        }
    </style>
</head>

<body>

    <strong class="section-title">駆除依頼内容</strong>
    <section class="card">

        <label for="targetAnimal">駆除対象動物</label>
        <select id="targetAnimal">
            <option value="">選択してください</option>
            <option value="シカ">シカ</option>
            <option value="イノシシ">イノシシ</option>
            <option value="アライグマ">アライグマ</option>
            <option value="カラスなど鳥類">カラスなど鳥類</option>
            <option value="その他の動物">その他の動物（別途、対象動物の確認をします）</option>
        </select>

        <label for="controlMethod">駆除方法</label>
        <select id="controlMethod">
            <option value="">選択してください</option>
            <option value="指定無し">指定無し</option>
            <option value="罠猟">罠猟</option>
            <option value="猟銃">猟銃</option>
            <option value="網猟">網猟</option>
        </select>

        <label for="hunterSupport">協力可能事項</label>
        <select id="hunterSupport">
            <option value="">選択してください</option>
            <option value="特になし">特になし</option>
            <option value="餌の追加">餌の追加</option>
            <option value="罠の確認">罠の確認</option>
        </select>
    </section>

    <section class="card">
        <strong class="section-title">駆除依頼場所の選択</strong>
        <p id="info" class="description">地図上の駆除依頼地点をタップして、場所を確定してください。</p>

        <div id="mapWrap">
            <div id="map"></div>
        </div>

        <button id="confirmBtn" type="button" disabled>この場所で確定</button>

        <div id="placeBox" class="place-box">
            <div class="place-title">選択場所</div>
            <div class="muted">住所：未選択</div>
            <div class="muted">座標：未選択</div>
        </div>
    </section>

    <div class="footer">
        <button id="sendBtn" type="button" disabled>駆除依頼の送信</button>
    </div>

    <script>
        const LIFF_ID = "2010521507-ZG7iBcwx"
        const GOOGLE_API_KEY = "AIzaSyBoyT10gc7UNf9j9SKKp_GRDdS7QNfMYrk"
        const DEFAULT_CENTER = { lat: 42.92402781240374, lng: 143.196002466975 }

        let map
        let marker
        let geocoder
        let previewLatLng = null
        let previewAddress = ""
        let confirmedLatLng = null
        let confirmedAddress = ""
        let requestId = 0
        let isConfirmed = false

        const el = (id) => document.getElementById(id)

        function validateForm() {
            return Boolean(
                el("targetAnimal").value &&
                el("controlMethod").value &&
                el("hunterSupport").value &&
                confirmedLatLng &&
                isConfirmed
            )
        }

        function updateSendButtonState() {
            el("sendBtn").disabled = !validateForm()
        }

        async function initLiff() {
            try {
                await liff.init({ liffId: LIFF_ID })
            } catch (e) {
                console.log("LIFF outside")
            }
        }

        window.initMap = function initMap() {
            geocoder = new google.maps.Geocoder()

            map = new google.maps.Map(el("map"), {
                center: DEFAULT_CENTER,
                zoom: 16,
                gestureHandling: "greedy",
                mapTypeControl: false,
                streetViewControl: false,
                fullscreenControl: false
            })

            map.addListener("click", (event) => {
                selectLocation(event.latLng)
            })

            el("info").innerText = "地図上の駆除依頼地点をタップしてください。"
        }

        function selectLocation(latLng) {
            requestId += 1
            const currentId = requestId

            previewLatLng = latLng
            previewAddress = ""
            isConfirmed = false
            confirmedLatLng = null
            confirmedAddress = ""

            if (!marker) {
                marker = new google.maps.Marker({
                    position: previewLatLng,
                    map: map,
                    icon: {
                        path: google.maps.SymbolPath.CIRCLE,
                        scale: 10,
                        fillColor: "#e53935",
                        fillOpacity: 1,
                        strokeColor: "#ffffff",
                        strokeWeight: 3
                    }
                })
            } else {
                marker.setPosition(previewLatLng)
                marker.setMap(map)
            }

            el("info").innerText = "住所取得中です。"
            el("confirmBtn").innerText = "この場所で確定"
            el("confirmBtn").disabled = false
            updateSendButtonState()
            renderPlaceBox("住所取得中...", previewLatLng.lat(), previewLatLng.lng())

            geocoder.geocode({ location: previewLatLng }, (results, status) => {
                if (currentId !== requestId) return

                if (status === "OK" && results[0]) {
                    previewAddress = results[0].formatted_address
                } else {
                    const lat = previewLatLng.lat()
                    const lng = previewLatLng.lng()
                    previewAddress = `緯度:${lat}, 経度:${lng}`
                }

                renderPlaceBox(previewAddress, previewLatLng.lat(), previewLatLng.lng())
                el("info").innerText = "場所を確認して確定してください。"
            })
        }

        function renderPlaceBox(address, lat, lng) {
            el("placeBox").innerHTML = `
                <div class="place-title">選択場所</div>
                <div>住所：${escapeHtml(address)}</div>
                <div>座標：${Number(lat).toFixed(8)}, ${Number(lng).toFixed(8)}</div>
            `
        }

        el("confirmBtn").addEventListener("click", () => {
            if (!previewLatLng) return

            confirmedLatLng = previewLatLng
            confirmedAddress = previewAddress
            isConfirmed = true

            if (marker) {
                marker.setPosition(confirmedLatLng)
                marker.setMap(map)
            }

            el("confirmBtn").innerText = "依頼場所の変更"
            el("info").innerText = "この場所で送信できます。変更する場合は、地図上の変更先をタップして再度確定してください。"
            renderPlaceBox(confirmedAddress, confirmedLatLng.lat(), confirmedLatLng.lng())
            updateSendButtonState()
        })

        el("sendBtn").addEventListener("click", async () => {
            if (!confirmedLatLng || !isConfirmed || !validateForm()) return

            const animal = el("targetAnimal").value
            const method = el("controlMethod").value
            const hunterSupport = el("hunterSupport").value
            const lat = confirmedLatLng.lat()
            const lng = confirmedLatLng.lng()
            const message = `駆除対象：${animal}
駆除方法：${method}
ハンターへの協力可能事項：${hunterSupport}
住所：${confirmedAddress}
座標：${lat}, ${lng}`

            if (typeof liff !== "undefined" && liff.isInClient()) {
                await liff.sendMessages([
                    {
                        type: "text",
                        text: "駆除依頼登録をお願いします"
                    },
                    {
                        type: "text",
                        text: message
                    }
                ])

                liff.closeWindow()
            } else {
                alert(message)
            }
        })

        function loadGoogleMaps() {
            const script = document.createElement("script")
            script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_API_KEY}&callback=initMap`
            script.async = true
            script.defer = true
            document.head.appendChild(script)
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;")
        }

        el("targetAnimal").addEventListener("change", updateSendButtonState)
        el("controlMethod").addEventListener("change", updateSendButtonState)
        el("hunterSupport").addEventListener("change", updateSendButtonState)

        updateSendButtonState()
        initLiff()
        loadGoogleMaps()
    </script>
</body>

</html>
